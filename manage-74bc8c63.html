<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>White Frost Admin</title>
<style>
:root{--paper:#f3f6f7;--ink:#12222b;--muted:#566b77;--rule:#c2d1d9;--signal:#0a6f8f;--ok:#1a7f4b;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--paper:#0c171e;--ink:#e6eff3;--muted:#8fa4b0;--rule:#253945;--signal:#6fc0dc;--ok:#5fcf93;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
label.f{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}
input[type=text],input[type=password]{width:100%;padding:12px;font:inherit;color:inherit;background:transparent;border:1px solid var(--rule);border-radius:8px}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:14px 18px;cursor:pointer;background:var(--signal);color:#fff;width:100%;display:block;text-align:center}
.btn.alt,button.alt{background:transparent;color:var(--signal);border:1px solid var(--signal)}
button:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:8px}
.seg button{background:transparent;color:var(--ink);border:1px solid var(--rule);padding:12px 8px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{margin-bottom:6px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.item img,.item .ph{width:56px;height:56px;object-fit:cover;border-radius:6px;background:var(--rule);flex:none}
.item .ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.item .body{flex:1;min-width:0}
.item input{padding:8px 10px;font-size:14px}
.item .st{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-word}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.item .name{font-size:14px;word-break:break-all}
.item button{width:auto;padding:9px 12px;font-size:13px;background:transparent;color:var(--bad);border:1px solid var(--bad)}
#msg{margin:16px 0 0;font-weight:600}
[hidden]{display:none!important}
.gap{height:12px}
</style>
</head>
<body>
<main>
  <h1>White Frost Admin</h1>
  <p class="sub">Add or remove website photos and catalogues.</p>

  <section id="login">
    <label class="f" for="user">Username</label>
    <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label class="f" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="hint"><label><input id="remember" type="checkbox" checked> Remember on this phone</label></p>
    <div class="gap"></div>
    <button id="signin" type="button">Sign in</button>
    <p id="loginmsg" class="st bad"></p>
  </section>

  <section id="app" hidden>
    <div class="seg tabs" role="group" aria-label="Section">
      <button type="button" id="tabAdd" aria-pressed="true">Add</button>
      <button type="button" id="tabDel" aria-pressed="false">Remove</button>
    </div>

    <label class="f">What are you adding or removing?</label>
    <div class="seg" role="group" aria-label="Type">
      <button type="button" id="kGallery" aria-pressed="true">Photos</button>
      <button type="button" id="kCat" aria-pressed="false">Catalogues</button>
    </div>

    <div id="addPane">
      <label class="f" for="group">Group name (optional)</label>
      <input id="group" type="text" placeholder="For example: Cold rooms" maxlength="40">
      <p class="hint">Photos with a group name get their own filter button on the Gallery page. Leave empty if not needed.</p>

      <div class="gap"></div><div class="gap"></div>
      <label class="btn alt" for="pick" id="pickLbl">Choose photos</label>
      <input id="pick" type="file" multiple hidden>
      <div id="list"></div>
      <div class="gap"></div>
      <button id="go" type="button" disabled>Upload</button>
      <p id="msg"></p>
    </div>

    <div id="delPane" hidden>
      <div class="gap"></div>
      <button id="show" type="button" class="alt">Show what is on the website</button>
      <div id="items"></div>
      <p id="delmsg" class="st"></p>
    </div>
  </section>
</main>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
/* >>> Paste your Cloudflare worker address between the quotes (see setup steps) <<< */
var API='https://wf-admin.superhero123634.workers.dev';
var pw='', user='', kind='gallery', files=[], busy=false;
var PHOTO_EXT=['jpg','jpeg','jpe','jfif','png','webp','gif','avif','bmp','svg','tif','tiff'];
var CAT_EXT=['pdf','xlsx','xls','docx','doc'];

function api(path,body){
  body=body||{}; body.password=pw; body.username=user;
  if(API.indexOf('https://')!==0){return Promise.resolve({ok:false,error:'This page is not set up yet: the worker address is missing.'})}
  return fetch(API.replace(/\/+$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {error:'Unexpected reply'}}).then(function(j){j.status=r.status;return j})});
}
function press(ids,on){ids.forEach(function(id){$(id).setAttribute('aria-pressed',id===on?'true':'false')})}

/* sign in */
function signin(auto){
  pw=$('pw').value; user=$('user').value.trim();
  if(!pw||!user){return}
  $('signin').disabled=true; $('loginmsg').textContent='';
  api('/api/check').then(function(j){
    $('signin').disabled=false;
    if(j.ok){
      try{ if($('remember').checked) localStorage.setItem('wf_cred',JSON.stringify({u:user,p:pw})); else localStorage.removeItem('wf_cred'); }catch(e){}
      $('login').hidden=true; $('app').hidden=false;
    }else{
      if(auto){try{localStorage.removeItem('wf_cred')}catch(e){}}
      $('loginmsg').textContent=j.error||'Could not sign in';
    }
  }).catch(function(){$('signin').disabled=false;$('loginmsg').textContent='No internet connection'});
}
$('signin').addEventListener('click',function(){signin(false)});
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')signin(false)});
try{var saved=JSON.parse(localStorage.getItem('wf_cred')||'null'); if(saved&&saved.u&&saved.p){$('user').value=saved.u;$('pw').value=saved.p;signin(true)}}catch(e){}

/* tabs and type */
function setTab(add){
  press(['tabAdd','tabDel'],add?'tabAdd':'tabDel');
  $('addPane').hidden=!add; $('delPane').hidden=add;
}
$('tabAdd').addEventListener('click',function(){setTab(true)});
$('tabDel').addEventListener('click',function(){setTab(false);$('items').textContent='';$('delmsg').textContent=''});
function setKind(k){
  kind=k; press(['kGallery','kCat'],k==='gallery'?'kGallery':'kCat');
  $('pick').accept=k==='gallery'?'image/*':'.pdf,.xlsx,.xls,.docx,.doc';
  $('pickLbl').textContent=k==='gallery'?'Choose photos':'Choose catalogue files';
  files=[]; $('list').textContent=''; $('go').disabled=true; $('msg').textContent='';
  $('items').textContent='';
}
$('kGallery').addEventListener('click',function(){setKind('gallery')});
$('kCat').addEventListener('click',function(){setKind('catalogues')});

/* choosing files */
function extOf(n){var p=n.split('.');return p.length>1?p.pop().toLowerCase():''}
function stemOf(n){return n.replace(/\.[^.]+$/,'')}
function slug(s){return s.trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()}
function guessCaption(n){
  var s=stemOf(n);
  if(kind==='gallery' && /\d{4,}/.test(s)) return '';
  return s.replace(/[_-]+/g,' ').trim();
}
$('pick').addEventListener('change',function(){
  var chosen=Array.prototype.slice.call($('pick').files);
  $('pick').value='';
  var ok=kind==='gallery'?PHOTO_EXT:CAT_EXT;
  chosen.forEach(function(f){
    var e=extOf(f.name);
    var row={file:f,ext:e,caption:guessCaption(f.name)};
    row.bad=ok.indexOf(e)<0 ? (e==='heic'||e==='heif' ? 'This photo type is not supported. Please send it as JPG.' : 'This file type is not allowed here.') : '';
    files.push(row);
  });
  draw();
});
function draw(){
  var box=$('list'); box.textContent='';
  files.forEach(function(r,i){
    var d=document.createElement('div'); d.className='item';
    var th;
    if(kind==='gallery' && !r.bad && r.ext!=='tif' && r.ext!=='tiff'){
      th=document.createElement('img'); th.alt=''; r.url=r.url||URL.createObjectURL(r.file); th.src=r.url;
    }else{th=document.createElement('div');th.className='ph';th.textContent=(r.ext||'file').toUpperCase()}
    var b=document.createElement('div'); b.className='body';
    var inp=document.createElement('input'); inp.type='text'; inp.maxLength=60;
    inp.placeholder=kind==='gallery'?'Caption (optional)':'Name of catalogue';
    inp.value=r.caption; inp.disabled=!!r.bad||busy;
    inp.addEventListener('input',function(){r.caption=inp.value});
    var st=document.createElement('div'); st.className='st'+(r.bad?' bad':''); st.textContent=r.bad||r.status||''; r.el=st;
    b.appendChild(inp); b.appendChild(st);
    var x=document.createElement('button'); x.type='button'; x.textContent='\u00d7'; x.setAttribute('aria-label','Remove from list');
    x.style.width='40px'; x.style.padding='8px'; x.disabled=busy;
    x.addEventListener('click',function(){files.splice(i,1);draw()});
    d.appendChild(th); d.appendChild(b); d.appendChild(x); box.appendChild(d);
  });
  $('go').disabled=busy||!files.some(function(r){return !r.bad&&!r.done});
}

/* shrink photos before upload */
function shrink(f,ext){
  var keep={gif:1,svg:1,avif:1,tif:1,tiff:1};
  if(kind!=='gallery'||keep[ext]) return Promise.resolve({blob:f,ext:ext});
  return createImageBitmap(f,{imageOrientation:'from-image'}).then(function(bmp){
    var s=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    var c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    return new Promise(function(res,rej){c.toBlob(function(b){b?res({blob:b,ext:'jpg'}):rej()},'image/jpeg',0.85)});
  }).catch(function(){return {blob:f,ext:ext}});
}
function b64(blob){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)});
}

/* upload one by one */
$('go').addEventListener('click',function(){
  if(busy) return;
  busy=true; $('msg').textContent=''; draw();
  var stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  var todo=files.filter(function(r){return !r.bad&&!r.done});
  var okCount=0, failCount=0, n=0;
  function next(){
    if(n>=todo.length){
      busy=false; draw();
      if(!failCount){$('msg').textContent='Done! '+okCount+' uploaded. The website will update in 1 to 2 minutes.';$('msg').className='st ok'}
      else{$('msg').textContent=okCount+' uploaded, '+failCount+' failed. Tap Upload to try the failed ones again.';$('msg').className='st bad'}
      return;
    }
    var r=todo[n++];
    r.el.className='st'; r.el.textContent='Preparing...';
    shrink(r.file,r.ext).then(function(o){
      if(o.blob.size>12*1024*1024){throw new Error('File is too big (over 12 MB)')}
      var base=slug(r.caption)|| (kind==='gallery'?'photo-'+stamp+'-'+n:slug(stemOf(r.file.name))||'catalogue-'+stamp);
      r.el.textContent='Uploading...';
      return b64(o.blob).then(function(data){
        return api('/api/upload',{folder:kind,group:$('group').value,name:base+'.'+o.ext,content:data});
      });
    }).then(function(j){
      if(j.ok){r.done=true;okCount++;r.el.className='st ok';r.el.textContent='Uploaded'}
      else{failCount++;r.el.className='st bad';r.el.textContent=j.error||'Upload failed'}
    }).catch(function(e){failCount++;r.el.className='st bad';r.el.textContent=(e&&e.message)||'Upload failed'}).then(next);
  }
  next();
});

/* remove */
$('show').addEventListener('click',function(){
  $('delmsg').textContent='Loading...'; $('delmsg').className='st'; $('items').textContent='';
  api('/api/list',{folder:kind}).then(function(j){
    if(!j.ok){$('delmsg').textContent=j.error||'Could not load';$('delmsg').className='st bad';return}
    $('delmsg').textContent=j.items.length?'':'Nothing here yet.';
    j.items.forEach(function(it){
      var d=document.createElement('div'); d.className='item';
      var th;
      if(kind==='gallery'&&/\.(jpe?g|png|webp|gif|avif|bmp|svg)$/i.test(it.name)){th=document.createElement('img');th.alt='';th.loading='lazy';th.src=it.url}
      else{th=document.createElement('div');th.className='ph';th.textContent=(it.name.split('.').pop()||'').toUpperCase()}
      var b=document.createElement('div'); b.className='body';
      var nm=document.createElement('div'); nm.className='name'; nm.textContent=it.path.replace(/^[^/]+\//,'');
      b.appendChild(nm);
      var x=document.createElement('button'); x.type='button'; x.textContent='Delete';
      x.addEventListener('click',function(){
        if(!confirm('Delete '+nm.textContent+' from the website?')) return;
        x.disabled=true;
        api('/api/delete',{path:it.path}).then(function(r){
          if(r.ok){d.remove();$('delmsg').textContent='Deleted. The website will update in 1 to 2 minutes.';$('delmsg').className='st ok'}
          else{x.disabled=false;$('delmsg').textContent=r.error||'Could not delete';$('delmsg').className='st bad'}
        });
      });
      d.appendChild(th); d.appendChild(b); d.appendChild(x); $('items').appendChild(d);
    });
  });
});
})();
</script>
</body>
</html>
