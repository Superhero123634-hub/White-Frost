<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WF Admin">
<meta name="robots" content="noindex,nofollow">
<title>White Frost Admin</title>
<style>
:root{--ink:#2a2118;--mut:rgba(60,44,30,.62);--line:rgba(120,90,60,.16);--ok:#1f8f55;--bad:#c9372c;--rx:0deg;--ry:0deg;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#f6efe4}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:400 17px/1.45 var(--f);background:linear-gradient(165deg,#fffaf2 0%,#f8efe2 55%,#f3e6d5 100%) fixed;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.6;animation:fl 18s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle at 35% 35%,#ffdcae,#ffb56e 70%)}
.orbs i:nth-child(2){width:38vmax;height:38vmax;right:-12vmax;top:28vh;background:radial-gradient(circle at 40% 40%,#ffecc0,#f4c56a 70%);animation-delay:-6s}
.orbs i:nth-child(3){width:34vmax;height:34vmax;left:10vw;bottom:-16vmax;background:radial-gradient(circle at 40% 40%,#ffd3c6,#f0a595 75%);animation-delay:-11s;opacity:.42}
@keyframes fl{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
main{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top,0px)) 16px calc(50px + env(safe-area-inset-bottom,0px));perspective:1000px}
h1{font:700 34px/1.1 var(--f);letter-spacing:-.02em;margin:6px 6px 4px}
p.sub{margin:0 6px 20px;color:var(--mut);font-size:15px}
#login,#app{position:relative;padding:20px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.42));border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(120,80,40,.06),0 2px 4px rgba(90,60,30,.08),0 18px 40px -10px rgba(120,80,40,.28),0 40px 80px -24px rgba(120,80,40,.22);transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .25s ease-out}
#login::before,#app::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.8),transparent 40%);opacity:.5;pointer-events:none}
label.f{display:block;font-weight:600;font-size:13px;color:var(--mut);margin:16px 4px 7px}
input[type=text],input[type=password]{width:100%;padding:14px 16px;font:inherit;font-size:17px;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 2px 5px rgba(120,80,40,.12);outline:0}
input::placeholder{color:rgba(60,44,30,.4)}
input[type=text]:focus,input[type=password]:focus{border-color:rgba(10,132,255,.55);box-shadow:inset 0 2px 5px rgba(120,80,40,.1),0 0 0 4px rgba(10,132,255,.22)}
input[type=checkbox]{accent-color:#0a84ff;width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.hint{color:var(--mut);font-size:13px;margin:8px 4px 0}
button,.btn{font:600 17px var(--f);border:0;border-radius:16px;padding:15px 18px;width:100%;display:block;text-align:center;color:#fff;cursor:pointer;background:linear-gradient(180deg,#3da0ff,#0a84ff 55%,#0670e0);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -6px rgba(10,132,255,.55),0 2px 4px rgba(0,0,0,.15);transition:transform .15s,filter .15s}
button:active,.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.alt,button.alt{background:rgba(255,255,255,.75);border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(120,80,40,.1);color:var(--ink)}
button:disabled{opacity:.4;pointer-events:none}
.seg{position:relative;display:flex;padding:3px;border-radius:14px;background:rgba(120,90,60,.13);box-shadow:inset 0 1px 3px rgba(120,80,40,.2)}
.seg button{flex:1;background:none;box-shadow:none;border-radius:11px;padding:9px 6px;font-size:15px;color:var(--mut);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:11px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.82));box-shadow:inset 0 1px 0 #fff,0 3px 8px rgba(90,60,30,.2);transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.seg:has(button:last-child[aria-pressed=true])::before{transform:translateX(100%)}
@supports not selector(:has(*)){.seg button[aria-pressed=true]{background:#fff}}
#list,#items{margin-top:14px;border-radius:20px;background:rgba(255,255,255,.5);overflow:hidden}
#list:empty,#items:empty{display:none}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px}
.item+.item{border-top:1px solid var(--line)}
.item img,.item .ph{width:56px;height:56px;object-fit:cover;border-radius:12px;flex:none;box-shadow:0 4px 10px rgba(90,60,30,.22)}
.item .ph{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--mut);background:rgba(120,90,60,.1)}
.item .body{flex:1;min-width:0}
.item input{padding:9px 12px;font-size:15px;border-radius:12px}
.st{font-size:13px;color:var(--mut);margin:4px 0 0;word-break:break-word}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.item .name{font-size:15px;word-break:break-all}
.item button{width:auto;padding:9px 14px;font-size:14px;color:var(--bad);background:rgba(255,69,58,.1);border:1px solid rgba(201,55,44,.3);box-shadow:none}
#msg{margin:14px 4px 0;font-weight:600;font-size:15px}
#loginmsg,#delmsg{margin:12px 4px 0}
[hidden]{display:none!important}
.gap{height:12px}
@media(prefers-reduced-motion:reduce){.orbs i{animation:none}#login,#app,.seg::before{transition:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#login,#app{background:rgba(255,250,242,.95)}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <h1>White Frost Admin</h1>
  <p class="sub">Add or remove website photos and catalogues.</p>

  <section id="login">
    <label class="f" for="user">Username</label>
    <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label class="f" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="hint"><label><input id="remember" type="checkbox" checked> Remember on this phone</label></p>
    <div class="gap"></div>
    <button id="signin" type="button">Sign in</button>
    <p id="loginmsg" class="st bad"></p>
  </section>

  <section id="app" hidden>
    <div class="seg tabs" role="group" aria-label="Section">
      <button type="button" id="tabAdd" aria-pressed="true">Add</button>
      <button type="button" id="tabDel" aria-pressed="false">Remove</button>
    </div>

    <label class="f">What are you adding or removing?</label>
    <div class="seg" role="group" aria-label="Type">
      <button type="button" id="kGallery" aria-pressed="true">Photos</button>
      <button type="button" id="kCat" aria-pressed="false">Catalogues</button>
    </div>

    <div id="addPane">
      <label class="f" for="group">Group name (optional)</label>
      <input id="group" type="text" placeholder="For example: Cold rooms" maxlength="40">
      <p class="hint">Photos with a group name get their own filter button on the Gallery page. Leave empty if not needed.</p>

      <div class="gap"></div><div class="gap"></div>
      <label class="btn alt" for="pick" id="pickLbl">Choose photos</label>
      <input id="pick" type="file" multiple hidden>
      <div id="list"></div>
      <div class="gap"></div>
      <button id="go" type="button" disabled>Upload</button>
      <p id="msg"></p>
    </div>

    <div id="delPane" hidden>
      <div class="gap"></div>
      <button id="show" type="button" class="alt">Show what is on the website</button>
      <div id="items"></div>
      <p id="delmsg" class="st"></p>
    </div>
  </section>
</main>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
/* >>> Paste your Cloudflare worker address between the quotes (see setup steps) <<< */
var API='https://wf-admin.superhero123634.workers.dev';
var pw='', user='', kind='gallery', files=[], busy=false;
var PHOTO_EXT=['jpg','jpeg','jpe','jfif','png','webp','gif','avif','bmp','svg','tif','tiff'];
var CAT_EXT=['pdf','xlsx','xls','docx','doc'];

function api(path,body){
  body=body||{}; body.password=pw; body.username=user;
  if(API.indexOf('https://')!==0){return Promise.resolve({ok:false,error:'This page is not set up yet: the worker address is missing.'})}
  return fetch(API.replace(/\/+$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {error:'Unexpected reply'}}).then(function(j){j.status=r.status;return j})}).catch(diagnose);
}
function diagnose(){
  var base=API.replace(/\/+$/,'');
  return fetch(base+'/api/check',{method:'POST',mode:'no-cors',body:'{}'}).then(function(){
    return {ok:false,error:'The helper is there but it refused this page. This page is at '+location.origin+'. In Cloudflare, check the SITE_URL setting, then tap Deploy and try again.'};
  },function(){
    return {ok:false,error:'Cannot reach the helper at '+base+'. In Cloudflare open wf-admin, then Domains and routes, and make sure workers.dev is Enabled.'};
  });
}
function press(ids,on){ids.forEach(function(id){$(id).setAttribute('aria-pressed',id===on?'true':'false')})}

/* sign in */
function signin(auto){
  pw=$('pw').value; user=$('user').value.trim();
  if(!pw||!user){return}
  $('signin').disabled=true; $('loginmsg').textContent='';
  api('/api/check').then(function(j){
    $('signin').disabled=false;
    if(j.ok){
      try{ if($('remember').checked) localStorage.setItem('wf_cred',JSON.stringify({u:user,p:pw})); else localStorage.removeItem('wf_cred'); }catch(e){}
      $('login').hidden=true; $('app').hidden=false;
    }else{
      if(auto){try{localStorage.removeItem('wf_cred')}catch(e){}}
      $('loginmsg').textContent=j.error||'Could not sign in';
    }
  }).catch(function(){$('signin').disabled=false;$('loginmsg').textContent='No internet connection'});
}
$('signin').addEventListener('click',function(){signin(false)});
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')signin(false)});
try{var saved=JSON.parse(localStorage.getItem('wf_cred')||'null'); if(saved&&saved.u&&saved.p){$('user').value=saved.u;$('pw').value=saved.p;signin(true)}}catch(e){}

/* tabs and type */
function setTab(add){
  press(['tabAdd','tabDel'],add?'tabAdd':'tabDel');
  $('addPane').hidden=!add; $('delPane').hidden=add;
}
$('tabAdd').addEventListener('click',function(){setTab(true)});
$('tabDel').addEventListener('click',function(){setTab(false);$('items').textContent='';$('delmsg').textContent=''});
function setKind(k){
  kind=k; press(['kGallery','kCat'],k==='gallery'?'kGallery':'kCat');
  $('pick').accept=k==='gallery'?'image/*':'.pdf,.xlsx,.xls,.docx,.doc';
  $('pickLbl').textContent=k==='gallery'?'Choose photos':'Choose catalogue files';
  files=[]; $('list').textContent=''; $('go').disabled=true; $('msg').textContent='';
  $('items').textContent='';
}
$('kGallery').addEventListener('click',function(){setKind('gallery')});
$('kCat').addEventListener('click',function(){setKind('catalogues')});

/* choosing files */
function extOf(n){var p=n.split('.');return p.length>1?p.pop().toLowerCase():''}
function stemOf(n){return n.replace(/\.[^.]+$/,'')}
function slug(s){return s.trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()}
function guessCaption(n){
  var s=stemOf(n);
  if(kind==='gallery' && /\d{4,}/.test(s)) return '';
  return s.replace(/[_-]+/g,' ').trim();
}
$('pick').addEventListener('change',function(){
  var chosen=Array.prototype.slice.call($('pick').files);
  $('pick').value='';
  var ok=kind==='gallery'?PHOTO_EXT:CAT_EXT;
  chosen.forEach(function(f){
    var e=extOf(f.name);
    var row={file:f,ext:e,caption:guessCaption(f.name)};
    row.bad=ok.indexOf(e)<0 ? (e==='heic'||e==='heif' ? 'This photo type is not supported. Please send it as JPG.' : 'This file type is not allowed here.') : '';
    files.push(row);
  });
  draw();
});
function draw(){
  var box=$('list'); box.textContent='';
  files.forEach(function(r,i){
    var d=document.createElement('div'); d.className='item';
    var th;
    if(kind==='gallery' && !r.bad && r.ext!=='tif' && r.ext!=='tiff'){
      th=document.createElement('img'); th.alt=''; r.url=r.url||URL.createObjectURL(r.file); th.src=r.url;
    }else{th=document.createElement('div');th.className='ph';th.textContent=(r.ext||'file').toUpperCase()}
    var b=document.createElement('div'); b.className='body';
    var inp=document.createElement('input'); inp.type='text'; inp.maxLength=60;
    inp.placeholder=kind==='gallery'?'Caption (optional)':'Name of catalogue';
    inp.value=r.caption; inp.disabled=!!r.bad||busy;
    inp.addEventListener('input',function(){r.caption=inp.value});
    var st=document.createElement('div'); st.className='st'+(r.bad?' bad':(r.cls?' '+r.cls:'')); st.textContent=r.bad||r.status||''; r.el=st;
    b.appendChild(inp); b.appendChild(st);
    var x=document.createElement('button'); x.type='button'; x.textContent='\u00d7'; x.setAttribute('aria-label','Remove from list');
    x.style.width='40px'; x.style.padding='8px'; x.disabled=busy;
    x.addEventListener('click',function(){files.splice(i,1);draw()});
    d.appendChild(th); d.appendChild(b); d.appendChild(x); box.appendChild(d);
  });
  $('go').disabled=busy||!files.some(function(r){return !r.bad&&!r.done});
}

/* shrink photos before upload */
function shrink(f,ext){
  var keep={gif:1,svg:1,avif:1,tif:1,tiff:1};
  if(kind!=='gallery'||keep[ext]) return Promise.resolve({blob:f,ext:ext});
  return createImageBitmap(f,{imageOrientation:'from-image'}).then(function(bmp){
    var s=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    var c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    return new Promise(function(res,rej){c.toBlob(function(b){b?res({blob:b,ext:'jpg'}):rej()},'image/jpeg',0.85)});
  }).catch(function(){return {blob:f,ext:ext}});
}
function b64(blob){
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(blob)});
}

function setSt(r,cls,text){r.cls=cls;r.status=text;if(r.el){r.el.className='st'+(cls?' '+cls:'');r.el.textContent=text}}
/* upload one by one */
$('go').addEventListener('click',function(){
  if(busy) return;
  busy=true; $('msg').textContent=''; draw();
  var stamp=new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
  var todo=files.filter(function(r){return !r.bad&&!r.done});
  var okCount=0, failCount=0, n=0;
  function next(){
    if(n>=todo.length){
      busy=false; draw();
      if(!failCount){$('msg').textContent='Done! '+okCount+' uploaded. The website will update in 1 to 2 minutes.';$('msg').className='st ok'}
      else{$('msg').textContent=okCount+' uploaded, '+failCount+' failed. Tap Upload to try the failed ones again.';$('msg').className='st bad'}
      return;
    }
    var r=todo[n++];
    setSt(r,'','Preparing...');
    shrink(r.file,r.ext).then(function(o){
      if(o.blob.size>12*1024*1024){throw new Error('File is too big (over 12 MB)')}
      var base=slug(r.caption)|| (kind==='gallery'?'photo-'+stamp+'-'+n:slug(stemOf(r.file.name))||'catalogue-'+stamp);
      setSt(r,'','Uploading...');
      return b64(o.blob).then(function(data){
        return api('/api/upload',{folder:kind,group:$('group').value,name:base+'.'+o.ext,content:data});
      });
    }).then(function(j){
      if(j.ok){r.done=true;okCount++;setSt(r,'ok','Uploaded')}
      else{failCount++;setSt(r,'bad',j.error||'Upload failed')}
    }).catch(function(e){failCount++;setSt(r,'bad',(e&&e.message)||'Upload failed')}).then(next);
  }
  next();
});

/* remove */
$('show').addEventListener('click',function(){
  $('delmsg').textContent='Loading...'; $('delmsg').className='st'; $('items').textContent='';
  api('/api/list',{folder:kind}).then(function(j){
    if(!j.ok){$('delmsg').textContent=j.error||'Could not load';$('delmsg').className='st bad';return}
    $('delmsg').textContent=j.items.length?'':'Nothing here yet.';
    j.items.forEach(function(it){
      var d=document.createElement('div'); d.className='item';
      var th;
      if(kind==='gallery'&&/\.(jpe?g|png|webp|gif|avif|bmp|svg)$/i.test(it.name)){th=document.createElement('img');th.alt='';th.loading='lazy';th.src=it.url}
      else{th=document.createElement('div');th.className='ph';th.textContent=(it.name.split('.').pop()||'').toUpperCase()}
      var b=document.createElement('div'); b.className='body';
      var nm=document.createElement('div'); nm.className='name'; nm.textContent=it.path.replace(/^[^/]+\//,'');
      b.appendChild(nm);
      var x=document.createElement('button'); x.type='button'; x.textContent='Delete';
      x.addEventListener('click',function(){
        if(!confirm('Delete '+nm.textContent+' from the website?')) return;
        x.disabled=true;
        api('/api/delete',{path:it.path}).then(function(r){
          if(r.ok){d.remove();$('delmsg').textContent='Deleted. The website will update in 1 to 2 minutes.';$('delmsg').className='st ok'}
          else{x.disabled=false;$('delmsg').textContent=r.error||'Could not delete';$('delmsg').className='st bad'}
        });
      });
      d.appendChild(th); d.appendChild(b); d.appendChild(x); $('items').appendChild(d);
    });
  });
});
})();
/* gentle 3D tilt that follows the pointer (mouse only) */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches||!matchMedia('(hover:hover)').matches)return;
  var r=document.documentElement;
  addEventListener('pointermove',function(e){
    r.style.setProperty('--ry',((e.clientX/innerWidth-.5)*7).toFixed(2)+'deg');
    r.style.setProperty('--rx',((.5-e.clientY/innerHeight)*7).toFixed(2)+'deg');
  });
})();
</script>
</body>
</html>
