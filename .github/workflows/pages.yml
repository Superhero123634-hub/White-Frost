name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for "last updated" dates

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image tool
        run: npm install --no-save sharp
        continue-on-error: true   # if this fails, photos are used as uploaded

      - name: Build catalogue and gallery lists
        run: |
          node scripts/build-catalogues.mjs
          node scripts/build-gallery.mjs

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '/scripts' --exclude '/_site' --exclude '/gallery' --exclude '/node_modules' --exclude '/package-lock.json' ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
