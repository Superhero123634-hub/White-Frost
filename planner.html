<style>
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}
.chip{font:600 13px "Archivo",sans-serif;padding:9px 16px;border:1px solid var(--rule,#c2d1d9);border-radius:999px;background:transparent;color:var(--ink,#12222b);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink,#12222b);color:var(--paper,#f3f6f7);border-color:var(--ink,#12222b)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media(max-width:760px){.pgrid{grid-template-columns:1fr;gap:24px}}
.pl label,.cap{display:block;font:600 13px "Archivo",sans-serif;color:var(--muted,#566b77);margin:18px 0 7px}
.pl select,.pl input[type=number]{width:100%;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink,#12222b);background:transparent;border:1px solid var(--rule,#c2d1d9);border-radius:8px}
.row{display:flex;gap:10px}.row input{flex:1.4}.row select{flex:1}
.pl input[type=range]{width:100%;accent-color:var(--signal,#0a6f8f)}
.pl output{float:right;color:var(--ink,#12222b)}
.scene{height:270px;perspective:900px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;cursor:grab;user-select:none}
.room{position:relative;width:0;height:0;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;display:block;background:rgba(120,190,215,.2);border:1.5px solid rgba(10,111,143,.65)}
.front,.back{width:var(--w);height:var(--h)}.left,.right{width:var(--d);height:var(--h)}.top,.bottom{width:var(--w);height:var(--d)}
.front{transform:translate(-50%,-50%) translateZ(calc(var(--d)/2))}
.back{transform:translate(-50%,-50%) rotateY(180deg) translateZ(calc(var(--d)/2))}
.right{transform:translate(-50%,-50%) rotateY(90deg) translateZ(calc(var(--w)/2))}
.left{transform:translate(-50%,-50%) rotateY(-90deg) translateZ(calc(var(--w)/2))}
.top{transform:translate(-50%,-50%) rotateX(90deg) translateZ(calc(var(--h)/2))}
.bottom{transform:translate(-50%,-50%) rotateX(-90deg) translateZ(calc(var(--h)/2));background:rgba(10,111,143,.28)}
.door{position:absolute;left:50%;bottom:0;width:24%;height:72%;transform:translateX(-50%);border:1.5px solid rgba(10,111,143,.8);background:rgba(10,111,143,.18)}
.dim{margin:6px 0 0;text-align:center;font:600 16px "Archivo",sans-serif}
.hint{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted,#566b77)}
#res{margin:16px 0 0;font-weight:600}
.note{margin:22px 0 0;font-size:13px;color:var(--muted,#566b77);max-width:60ch}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

<script>
(function(){
var T={
en:{title:"Plan your cold room",intro:"Tell us what you want to store. We suggest a size, and you can send it to us with one tap.",q1:"What will you store?",p_veg:"Fruits and vegetables",p_dairy:"Dairy and beverages",p_meat:"Meat and fish",p_frozen:"Ice cream and frozen food",p_pharma:"Medicines and vaccines",p_other:"Something else",q2:"How much?",kg:"kg",tonnes:"tonnes",q3:"Temperature",chilled:"Chilled (+2 to +8 °C)",frozen:"Frozen (−18 to −22 °C)",adjust:"Change the size",len:"Length",wid:"Width",hei:"Height",vol:"Volume",holds:"Holds about",note:"This is a rough guide only. We confirm the exact size after checking your needs.",send:"Send this to enquiry",wa:"Send site photos on WhatsApp",drag:"Drag to turn the room"},
hi:{title:"अपना कोल्ड रूम प्लान करें",intro:"बताइए आप क्या रखना चाहते हैं। हम एक साइज़ सुझाएंगे, और आप एक टैप में हमें भेज सकते हैं।",q1:"आप क्या स्टोर करेंगे?",p_veg:"फल और सब्ज़ियाँ",p_dairy:"डेयरी और पेय पदार्थ",p_meat:"मांस और मछली",p_frozen:"आइसक्रीम और फ्रोज़न फूड",p_pharma:"दवाइयाँ और वैक्सीन",p_other:"कुछ और",q2:"कितना?",kg:"किलो",tonnes:"टन",q3:"तापमान",chilled:"चिल्ड (+2 से +8 °C)",frozen:"फ्रोज़न (−18 से −22 °C)",adjust:"साइज़ बदलें",len:"लंबाई",wid:"चौड़ाई",hei:"ऊँचाई",vol:"आयतन",holds:"लगभग क्षमता",note:"यह सिर्फ़ मोटा अंदाज़ा है। आपकी ज़रूरत देखकर हम सही साइज़ पक्का करेंगे।",send:"इसे इन्क्वायरी में भेजें",wa:"WhatsApp पर साइट की फ़ोटो भेजें",drag:"कमरे को घुमाने के लिए खींचें"},
gu:{title:"તમારો કોલ્ડ રૂમ પ્લાન કરો",intro:"તમે શું રાખવા માંગો છો તે જણાવો. અમે એક સાઇઝ સૂચવીશું, અને તમે એક ટેપમાં અમને મોકલી શકો છો.",q1:"તમે શું સ્ટોર કરશો?",p_veg:"ફળો અને શાકભાજી",p_dairy:"ડેરી અને પીણાં",p_meat:"માંસ અને માછલી",p_frozen:"આઈસ્ક્રીમ અને ફ્રોઝન ફૂડ",p_pharma:"દવાઓ અને રસી",p_other:"બીજું કંઈક",q2:"કેટલું?",kg:"કિલો",tonnes:"ટન",q3:"તાપમાન",chilled:"ચિલ્ડ (+2 થી +8 °C)",frozen:"ફ્રોઝન (−18 થી −22 °C)",adjust:"સાઇઝ બદલો",len:"લંબાઈ",wid:"પહોળાઈ",hei:"ઊંચાઈ",vol:"ઘનફળ",holds:"આશરે ક્ષમતા",note:"આ ફક્ત અંદાજ છે. તમારી જરૂરિયાત જોઈને અમે સાચી સાઇઝ નક્કી કરીશું.",send:"આને ઇન્ક્વાયરીમાં મોકલો",wa:"WhatsApp પર સાઇટના ફોટા મોકલો",drag:"રૂમ ફેરવવા માટે ખેંચો"},
hg:{title:"Apna cold room plan karein",intro:"Bataiye aap kya rakhna chahte hain. Hum ek size suggest karenge, aur aap ek tap mein humein bhej sakte hain.",q1:"Aap kya store karenge?",p_veg:"Fruits aur sabziyan",p_dairy:"Dairy aur drinks",p_meat:"Meat aur fish",p_frozen:"Ice cream aur frozen food",p_pharma:"Dawaiyan aur vaccine",p_other:"Kuch aur",q2:"Kitna?",kg:"kg",tonnes:"ton",q3:"Temperature",chilled:"Chilled (+2 se +8 °C)",frozen:"Frozen (−18 se −22 °C)",adjust:"Size badlein",len:"Lambai",wid:"Chaudai",hei:"Unchai",vol:"Volume",holds:"Lagbhag capacity",note:"Yeh sirf ek mota andaza hai. Aapki zaroorat dekhkar hum sahi size pakka karenge.",send:"Isse enquiry mein bhejein",wa:"WhatsApp par site ki photos bhejein",drag:"Room ghumane ke liye drag karein"}
};
/* rough planning guide: kg that fit per m3 of room volume (edit these to match your experience) */
var D={veg:150,dairy:200,meat:250,frozen:200,pharma:100,other:150};
var DT={veg:"chilled",dairy:"chilled",meat:"frozen",frozen:"frozen",pharma:"chilled",other:"chilled"};
var EN={veg:"Fruits and vegetables",dairy:"Dairy and beverages",meat:"Meat and fish",frozen:"Ice cream and frozen food",pharma:"Medicines and vaccines",other:"Something else"};
var TEMP_EN={chilled:"Chilled (+2 to +8 C)",frozen:"Frozen (-18 to -22 C)"};
var $=function(i){return document.getElementById(i)};
var lang="en",S={temp:"chilled",L:10,W:8,H:8};
try{lang=localStorage.getItem("wf_lang")||"en"}catch(e){}
if(!T[lang])lang="en";
function t(k){return T[lang][k]||T.en[k]}
function rnd(x){return Math.round(x*2)/2}
function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
function m(ft){return (ft*0.3048).toFixed(1)}

[["en","English"],["hi","हिन्दी"],["gu","ગુજરાતી"],["hg","Hinglish"]].forEach(function(l){
  var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=l[1];b.setAttribute("data-l",l[0]);
  b.addEventListener("click",function(){lang=l[0];try{localStorage.setItem("wf_lang",lang)}catch(e){}apply()});
  $("langs").appendChild(b);
});
Object.keys(D).forEach(function(k){var o=document.createElement("option");o.value=k;o.setAttribute("data-t","p_"+k);$("kind").appendChild(o)});
["chilled","frozen"].forEach(function(k){
  var b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("data-t",k);b.setAttribute("data-k",k);
  b.addEventListener("click",function(){S.temp=k;update()});
  $("temp").appendChild(b);
});

function fmt(kg){return kg>=1000?(kg/1000).toFixed(1)+" "+t("tonnes"):(Math.round(kg/10)*10)+" "+t("kg")}
function suggest(){
  var q=parseFloat($("qty").value)||0,kg=q*($("unit").value==="t"?1000:1);
  var v=Math.max(kg/D[$("kind").value],9),w=Math.sqrt(v*35.3147/8/1.25);
  S.H=8;S.W=clamp(rnd(w),6,40);S.L=clamp(rnd(w*1.25),6,60);
  update();
}
function update(){
  var k=$("kind").value,v=S.L*S.W*S.H/35.3147;
  ["L","W","H"].forEach(function(a){$(a).value=S[a];$("o"+a).textContent=S[a]+" ft"});
  $("dim").textContent=S.L+" × "+S.W+" × "+S.H+" ft  ("+m(S.L)+" × "+m(S.W)+" × "+m(S.H)+" m)";
  $("res").textContent=t("vol")+": "+v.toFixed(1)+" m³  ·  "+t("holds")+": "+fmt(v*D[k]);
  Array.prototype.forEach.call($("temp").children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-k")===S.temp?"true":"false")});
  var q=parseFloat($("qty").value)||0,
  d="Cold room, about "+S.L+" x "+S.W+" x "+S.H+" ft ("+m(S.L)+" x "+m(S.W)+" x "+m(S.H)+" m), about "+v.toFixed(0)+" m3. Storing: "+EN[k]+", about "+q+" "+($("unit").value==="t"?"tonnes":"kg")+". Temperature: "+TEMP_EN[S.temp]+". Planned with the website planner, please confirm.";
  $("go").href="inquiry.html?product=Cold%20room&details="+encodeURIComponent(d);
  $("wa").href="https://wa.me/919825940670?text="+encodeURIComponent("Hello White Frost, I am planning a cold room. "+d+" I will send photos of the site.");
  var s=190/Math.max(S.L,S.W,S.H),st=$("room").style;
  st.setProperty("--w",S.L*s+"px");st.setProperty("--d",S.W*s+"px");st.setProperty("--h",S.H*s+"px");
}
function apply(){
  document.documentElement.lang={en:"en",hi:"hi",gu:"gu",hg:"hi-Latn"}[lang];
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=t(e.getAttribute("data-t"))});
  Array.prototype.forEach.call($("langs").children,function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===lang?"true":"false")});
  update();
}
$("kind").addEventListener("change",function(){S.temp=DT[$("kind").value];suggest()});
$("qty").addEventListener("input",suggest);
$("unit").addEventListener("change",suggest);
["L","W","H"].forEach(function(a){$(a).addEventListener("input",function(){S[a]=parseFloat($(a).value);update()})});

/* 3D room: slow spin, drag to turn */
var ry=-30,rx=-20,drag=false,lx=0,ly=0,calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
$("scene").addEventListener("pointerdown",function(e){drag=true;lx=e.clientX;ly=e.clientY;$("scene").setPointerCapture(e.pointerId)});
$("scene").addEventListener("pointermove",function(e){if(!drag)return;ry+=(e.clientX-lx)*.6;rx=clamp(rx-(e.clientY-ly)*.4,-70,10);lx=e.clientX;ly=e.clientY});
["pointerup","pointercancel"].forEach(function(n){$("scene").addEventListener(n,function(){drag=false})});
(function spin(){if(!drag&&!calm)ry+=.25;$("room").style.transform="rotateX("+rx+"deg) rotateY("+ry+"deg)";requestAnimationFrame(spin)})();

$("kind").value="veg";
apply();suggest();
})();
</script>
